    <script>
      /* Suppress third-party browser extension injection errors (e.g. MetaMask inpage.js) */
      (function() {
        function isExtensionError(err) {
          if (!err) return false;
          var str = (err.message || '') + ' ' + (err.stack || '') + ' ' + String(err);
          return (
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-extension://') !== -1 ||
            str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            str.indexOf('MetaMask') !== -1 ||
            str.indexOf('Failed to connect to MetaMask') !== -1 ||
            str.indexOf('inpage.js') !== -1 ||
            str.indexOf('evmAsk') !== -1
          );
        }

        window.addEventListener('error', function(e) {
          if (isExtensionError(e.error) || isExtensionError(e.message) || isExtensionError(e.filename)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isExtensionError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
